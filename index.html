<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memoria de Bloques Pro</title>
<style>
  :root {
    --bg-main: #0f1115;
    --panel-bg: rgba(22, 27, 34, 0.75);
    --border-color: rgba(255, 255, 255, 0.1);
    --text-main: #f0f3f6;
    --text-muted: #8b949e;
    --accent: #3b82f6;
  }

  body.modo-claro {
    --bg-main: #f0f3f6;
    --panel-bg: rgba(255, 255, 255, 0.85);
    --border-color: rgba(0, 0, 0, 0.1);
    --text-main: #0f1115;
    --text-muted: #57606a;
  }

  body {
    background: var(--bg-main);
    color: var(--text-main);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    user-select: none;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .top-bar {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    z-index: 100;
    pointer-events: none;
  }
  .top-bar > * { pointer-events: auto; }

  .grupo-botones-top { display: flex; gap: 8px; }

  .btn-vista {
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--border-color);
    border-radius: 20px;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    color: var(--text-main);
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    transition: 0.2s;
  }
  .btn-vista:hover { background: rgba(128,128,128,0.15); }

  h1 { margin: 10px 0 5px; font-size: 28px; font-weight: 800; text-align: center; letter-spacing: -0.5px; }
  #estado { font-size: 15px; margin-bottom: 5px; color: var(--text-muted); height: 24px; text-align: center; font-weight: 500; }
  
  #vidasContainer {
    font-size: 18px;
    height: 28px;
    text-align: center;
    margin-bottom: 10px;
    display: none;
    letter-spacing: 4px;
  }

  .controles {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 18px;
    max-width: 680px;
  }

  select {
    padding: 9px 12px;
    font-size: 13px;
    font-weight: 500;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    color: var(--text-main);
    cursor: pointer;
    outline: none;
    transition: 0.2s;
  }
  select:hover { border-color: rgba(128,128,128,0.3); }

  .tablero-container {
    position: relative;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    padding: 20px;
    border-radius: 24px;
    border: 1px solid var(--border-color);
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    transition: 0.3s;
    overflow: hidden;
    min-width: 320px;
    min-height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tablero-container.panico {
    animation: latidoPanico 0.4s infinite alternate;
    border-color: #ef4444 !important;
  }
  @keyframes latidoPanico {
    from { box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
    to { box-shadow: 0 0 25px rgba(239, 68, 68, 0.9); }
  }

  .barra-tiempo {
    position: absolute;
    top: 0; left: 0; height: 4px; background: var(--accent);
    border-radius: 24px 24px 0 0; width: 100%;
    transition: width 0.05s linear, background-color 0.2s;
    display: none;
    z-index: 10;
  }

  .tablero { 
    display: grid; 
    grid-template-columns: repeat(3, 105px); 
    grid-gap: 12px; 
  }

  .bloque {
    border-radius: 14px;
    cursor: pointer;
    opacity: 0.4;
    width: 105px;
    height: 105px;
    transition: transform 0.1s ease, opacity 0.15s ease, box-shadow 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .bloque:hover { opacity: 0.6; }
  .iluminado {
    opacity: 1 !important;
    transform: scale(1.04);
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.9);
  }

  .acciones {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    justify-content: center;
    width: 100%;
    max-width: 320px;
  }

  .acciones button {
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
  }
  #btn { background: var(--text-main); color: var(--bg-main); flex: 1; box-shadow: 0 4px 15px rgba(255,255,255,0.15); }
  #btn:hover { opacity: 0.9; transform: translateY(-1px); }
  #btnRepetir { background: #eab308; color: #0f1115; display: none; }
  #btnRepetir:disabled { background: var(--border-color); color: var(--text-muted); cursor: not-allowed; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="grupo-botones-top">
    <button class="btn-vista" onclick="alternarTemaClaroDark()" id="btnTemaClaro">☀️ Claro</button>
    <button class="btn-vista" id="btnVista" onclick="alternarVista()">💻 Escritorio</button>
  </div>
</div>

<h1>Memoria de Bloques</h1>
<div id="estado">Selecciona opciones y presiona Jugar</div>
<div id="vidasContainer">❤️❤️❤️</div>

<div class="controles">
  <select id="modoJuego" onchange="cambiarModo()">
    <option value="clasico" selected>🕹️ Modo: Clásico</option>
    <option value="inverso">🔄 Modo: Espejo (Inverso)</option>
    <option value="contrarreloj">⏱️ Modo: Contrarreloj</option>
    <option value="caos">⚡ Modo: Caos (Aleatorio)</option>
    <option value="supervivencia">🛡️ Modo: Supervivencia (3 Vidas)</option>
    <option value="libre">🎹 Modo: Melodía Libre</option>
  </select>

  <select id="dificultad" onchange="armarTablero()">
    <option value="facil">🟢 Dificultad: Fácil (4 bloques)</option>
    <option value="normal" selected>🟡 Dificultad: Normal (6 bloques)</option>
    <option value="dificil">🟠 Dificultad: Difícil (9 bloques)</option>
    <option value="extremo">🔴 Dificultad: Extremo (15 bloques - 3x5)</option>
  </select>

  <select id="tipoSonido" onchange="probarSonido()">
    <option value="melodia" selected>🎶 Sonido: Melodía</option>
    <option value="piano">🎹 Sonido: Piano</option>
    <option value="campana">🔔 Sonido: Campana</option>
    <option value="laser">🚀 Sonido: Láser</option>
    <option value="gota">💧 Sonido: Gota de Agua</option>
    <option value="violin">🎻 Sonido: Violín</option>
    <option value="guitarra">🎸 Sonido: Guitarra</option>
    <option value="explosion">💥 Sonido: Explosión</option>
    <option value="timbre">🛎️ Sonido: Timbre</option>
    <option value="maullido">🐱 Sonido: Maullido</option>
  </select>

  <select id="temaColor" onchange="aplicarTema()">
    <option value="bosque" selected>🌿 Tema: Bosque Mágico</option>
    <option value="pastel">🌸 Tema: Rosa Pastel</option>
    <option value="galaxia">🌌 Tema: Galaxia</option>
    <option value="tecnologico">💻 Tema: Tecnológico</option>
    <option value="esmeralda">🌲 Tema: Esmeralda</option>
    <option value="atardecer">🌅 Tema: Atardecer</option>
    <option value="neon">⚡ Tema: Neón</option>
  </select>
</div>

<div class="tablero-container" id="tableroContainer">
  <div class="barra-tiempo" id="barraTiempo"></div>
  <div class="tablero" id="tablero">
    <!-- Bloques estáticos de respaldo por seguridad -->
    <div class="bloque" style="background:#00ff66;"></div>
    <div class="bloque" style="background:#10b981;"></div>
    <div class="bloque" style="background:#00e676;"></div>
    <div class="bloque" style="background:#00c853;"></div>
    <div class="bloque" style="background:#76ff03;"></div>
    <div class="bloque" style="background:#69f0ae;"></div>
  </div>
</div>

<div class="acciones">
  <button id="btn" onclick="iniciar()">Jugar</button>
  <button id="btnRepetir" onclick="usarRepetir()">🔁 Repetir (1)</button>
</div>

<script>
const temas = {
  bosque:      ['#00ff66', '#10b981', '#00e676', '#00c853', '#76ff03', '#69f0ae', '#00bfa5', '#aeea00'],
  pastel:      ['#ff4081', '#ff80ab', '#e040fb', '#d500f9', '#7c4dff', '#ff1744', '#aa00ff', '#ff6d00'],
  galaxia:     ['#00b0ff', '#2979ff', '#651fff', '#f50057', '#00e5ff', '#3d5afe', '#e040fb', '#0091ea'],
  tecnologico: ['#0070ff', '#00e5ff', '#2979ff', '#00b0ff', '#0091ea', '#536dfe', '#2962ff', '#00d2ff'],
  esmeralda:   ['#00c853', '#00e676', '#1de9b6', '#00b0ff', '#69f0ae', '#00bfa5', '#00e676', '#10b981'],
  atardecer:   ['#ff3d00', '#ff6d00', '#ffea00', '#f50057', '#ff9100', '#ff1744', '#ffab00', '#ff2a00'],
  neon:        ['#d500f9', '#f50057', '#00e5ff', '#00e676', '#ffea00', '#651fff', '#1de9b6', '#ff6d00']
};

const notas = [261.6, 293.6, 329.6, 349.2, 392.0, 440.0, 493.8, 523.2, 587.3, 659.2, 698.4, 783.9, 830.6, 880.0, 932.3];
const niveles = {
  facil:   { cant: 4,  col: 2, tam: 120, vel: 700, nom: 'Fácil' },
  normal:  { cant: 6,  col: 3, tam: 105, vel: 580, nom: 'Normal' },
  dificil: { cant: 9,  col: 3, tam: 90,  vel: 450, nom: 'Difícil' },
  extremo: { cant: 15, col: 3, tam: 65,  vel: 320, nom: 'Extremo (3x5)' }
};

let cfg = niveles.normal, seq = [], usr = [], lvl = 0, lock = true, ctx = null;
let esMovil = false, comodinDisponible = true;
let modoActual = 'clasico';
let esClaro = localStorage.getItem('simon_modo_claro') === 'true';
let vidas = 3;
let temporizadorTurno = null;
let tiempoRestante = 100;

window.addEventListener('DOMContentLoaded', () => {
  try {
    if (esClaro) {
      document.body.classList.add('modo-claro');
      const btnT = document.getElementById('btnTemaClaro');
      if(btnT) btnT.innerText = '🌙 Oscuro';
    }
    aplicarTema();
    armarTablero();
  } catch(e) {
    console.error("Error al iniciar:", e);
  }
});

function alternarTemaClaroDark() {
  esClaro = !esClaro;
  document.body.classList.toggle('modo-claro', esClaro);
  localStorage.setItem('simon_modo_claro', esClaro);
  const btnT = document.getElementById('btnTemaClaro');
  if(btnT) btnT.innerText = esClaro ? '🌙 Oscuro' : '☀️ Claro';
}

function vibrar(patron) {
  if (navigator.vibrate) { try { navigator.vibrate(patron); } catch (e) {} }
}

function aplicarTema() {
  const temaSel = document.getElementById('temaColor');
  const temaKey = temaSel ? temaSel.value : 'bosque';
  const paleta = temas[temaKey] || temas.bosque;
  if(paleta && paleta[0]) {
    document.documentElement.style.setProperty('--accent', paleta[0]);
  }
  armarTablero();
}

function alternarVista() {
  esMovil = !esMovil;
  const btn = document.getElementById('btnVista');
  if(btn) btn.innerText = esMovil ? '💻 Escritorio' : '📱 Móvil';
  armarTablero();
}

function armarTablero() {
  const difSel = document.getElementById('dificultad');
  cfg = niveles[difSel ? difSel.value : 'normal'] || niveles.normal;
  const temaSel = document.getElementById('temaColor');
  const paleta = temas[temaSel ? temaSel.value : 'bosque'] || temas.bosque;
  const tab = document.getElementById('tablero');
  if (!tab) return;
  
  tab.innerHTML = '';
  let tamFinal = cfg.tam;
  if (esMovil) {
    const anchoDisp = Math.min(window.innerWidth - 60, 340);
    tamFinal = Math.floor((anchoDisp - (cfg.col - 1) * 10) / cfg.col);
  }
  tab.style.gridTemplateColumns = `repeat(${cfg.col}, ${tamFinal}px)`;
  
  for (let i = 0; i < cfg.cant; i++) {
    const d = document.createElement('div');
    d.className = 'bloque'; 
    d.id = 'b' + i;
    d.style.background = paleta[i % paleta.length];
    d.style.width = tamFinal + 'px'; 
    d.style.height = tamFinal + 'px';
    
    d.addEventListener('touchstart', (e) => {
      e.preventDefault();
      tocar(i);
    }, {passive: false});
    d.onclick = () => tocar(i);

    tab.appendChild(d);
  }
}

function cambiarModo() {
  const modoSel = document.getElementById('modoJuego');
  modoActual = modoSel ? modoSel.value : 'clasico';
  const barra = document.getElementById('barraTiempo');
  const btnJugar = document.getElementById('btn');
  const estado = document.getElementById('estado');
  const vidasContainer = document.getElementById('vidasContainer');
  
  if(barra) barra.style.display = (modoActual === 'contrarreloj') ? 'block' : 'none';
  if(vidasContainer) vidasContainer.style.display = (modoActual === 'supervivencia') ? 'block' : 'none';
  
  const tabC = document.getElementById('tableroContainer');
  if(tabC) tabC.classList.remove('panico');

  if (modoActual === 'libre') {
    lock = false;
    if(btnJugar) btnJugar.style.display = 'none';
    const btnRep = document.getElementById('btnRepetir');
    if(btnRep) btnRep.style.display = 'none';
    if(estado) estado.innerText = '🎹 Modo Libre: Toca los bloques cuando quieras';
    document.querySelectorAll('.bloque').forEach(b => b.style.opacity = '0.8');
  } else {
    lock = true;
    if(btnJugar) btnJugar.style.display = 'block';
    if(estado) estado.innerText = 'Selecciona opciones y presiona Jugar';
    document.querySelectorAll('.bloque').forEach(b => b.style.opacity = '0.4');
  }
}

function sonido(i, ms) {
  try {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime, dur = ms / 1000;
    const tipoSel = document.getElementById('tipoSonido');
    const tipo = tipoSel ? tipoSel.value : 'melodia';
    const f = i === -1 ? 90 : notas[i % notas.length];

    if (i === -1) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(130, now); o.frequency.linearRampToValueAtTime(60, now + dur);
      g.gain.setValueAtTime(0.9, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now + dur);
      return;
    }

    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = tipo === 'piano' ? 'sine' : (tipo === 'laser' ? 'sawtooth' : 'triangle');
    o.frequency.setValueAtTime(f, now);
    g.gain.setValueAtTime(0.8, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now + dur);
  } catch (e) {}
}

function probarSonido() { sonido(2, 350); }

function luz(i) {
  const el = document.getElementById('b' + i);
  if (!el) return;
  const ms = Math.min(280, cfg.vel * 0.65);
  el.classList.add('iluminado'); 
  sonido(i, ms);
  setTimeout(() => el.classList.remove('iluminado'), ms);
}

function reproducirSecuencia() {
  lock = true;
  clearInterval(temporizadorTurno);
  const barra = document.getElementById('barraTiempo');
  if(barra) barra.style.width = '100%';
  const btnRep = document.getElementById('btnRepetir');
  if(btnRep) btnRep.disabled = true;
  const tabC = document.getElementById('tableroContainer');
  if(tabC) tabC.classList.remove('panico');
  const estado = document.getElementById('estado');
  if(estado) estado.innerText = `Nivel ${lvl} — Observa...`;
  
  seq.forEach((id, idx) => {
    setTimeout(() => {
      luz(id);
      if (idx === seq.length - 1) {
        setTimeout(() => {
          lock = false;
          let textoModo = modoActual === 'inverso' ? ' ¡Tu turno (Espejo)! ' : ' ¡Tu turno! ';
          if(estado) estado.innerText = `Nivel ${lvl} —${textoModo}`;
          if (comodinDisponible && modoActual !== 'contrarreloj' && btnRep) {
            btnRep.disabled = false;
          }
          if (modoActual === 'contrarreloj') {
            iniciarTemporizador();
          }
        }, cfg.vel * 0.7);
      }
    }, (idx + 1) * cfg.vel);
  });
}

function iniciarTemporizador() {
  clearInterval(temporizadorTurno);
  tiempoRestante = 100;
  const barra = document.getElementById('barraTiempo');
  const contenedorTablero = document.getElementById('tableroContainer');
  const tiempoTotalMs = Math.max(3000, 7000 - (lvl * 250));
  const intervaloMs = 40;
  const decremento = (intervaloMs / tiempoTotalMs) * 100;

  temporizadorTurno = setInterval(() => {
    if (lock) {
      clearInterval(temporizadorTurno);
      if(contenedorTablero) contenedorTablero.classList.remove('panico');
      return;
    }
    tiempoRestante -= decremento;
    if(barra) barra.style.width = Math.max(0, tiempoRestante) + '%';

    if (tiempoRestante <= 25) {
      if(contenedorTablero) contenedorTablero.classList.add('panico');
      if(barra) barra.style.backgroundColor = '#ef4444';
    } else {
      if(contenedorTablero) contenedorTablero.classList.remove('panico');
      if(barra) barra.style.backgroundColor = 'var(--accent)';
    }

    if (tiempoRestante <= 0) {
      clearInterval(temporizadorTurno);
      if(contenedorTablero) contenedorTablero.classList.remove('panico');
      perderPartida("¡Se acabó el tiempo!");
    }
  }, intervaloMs);
}

function usarRepetir() {
  if (lock || !comodinDisponible || modoActual === 'contrarreloj') return;
  comodinDisponible = false;
  usr = [];
  vibrar([50, 50, 50]);
  const btnRep = document.getElementById('btnRepetir');
  if(btnRep) {
    btnRep.innerText = '🔁 Repetir (Usado)';
    btnRep.disabled = true;
  }
  reproducirSecuencia();
}

function iniciar() {
  armarTablero(); 
  seq = []; usr = []; lvl = 0; vidas = 3; comodinDisponible = true;
  const vidasContainer = document.getElementById('vidasContainer');
  if (modoActual === 'supervivencia' && vidasContainer) {
    vidasContainer.innerText = '❤️❤️❤️';
  }
  const difSel = document.getElementById('dificultad');
  const modSel = document.getElementById('modoJuego');
  if(difSel) difSel.disabled = true;
  if(modSel) modSel.disabled = true;
  
  const btn = document.getElementById('btn');
  if(btn) btn.style.display = 'none';
  
  const btnRep = document.getElementById('btnRepetir');
  if(btnRep) {
    btnRep.style.display = (modoActual === 'contrarreloj' || modoActual === 'supervivencia') ? 'none' : 'block';
    btnRep.innerText = '🔁 Repetir (1)';
    btnRep.disabled = true;
  }
  sigNivel();
}

function sigNivel() {
  lvl++; usr = [];
  seq.push(Math.floor(Math.random() * cfg.cant));
  reproducirSecuencia();
}

function tocar(i) {
  if (modoActual === 'libre') {
    vibrar(25);
    luz(i);
    return;
  }

  if (lock) return;
  vibrar(35);
  luz(i); usr.push(i);

  let idxActual = usr.length - 1;
  let acerto = true;

  if (modoActual === 'inverso') {
    let indiceEsperado = seq.length - 1 - idxActual;
    if (usr[idxActual] !== seq[indiceEsperado]) acerto = false;
  } else {
    if (usr[idxActual] !== seq[idxActual]) acerto = false;
  }

  if (!acerto) {
    if (modoActual === 'supervivencia') {
      vidas--;
      const vidasContainer = document.getElementById('vidasContainer');
      if(vidasContainer) vidasContainer.innerText = '❤️'.repeat(vidas) + '🖤'.repeat(3 - vidas);
      sonido(-1, 400);
      vibrar(200);

      if (vidas > 0) {
        lock = true;
        clearInterval(temporizadorTurno);
        usr = [];
        const estado = document.getElementById('estado');
        if(estado) estado.innerText = `¡Falló! Vidas restantes: ${vidas}. Repitiendo...`;
        setTimeout(reproducirSecuencia, 1200);
        return;
      }
    }
    perderPartida();
    return;
  }

  if (usr.length === seq.length) {
    lock = true;
    clearInterval(temporizadorTurno);
    const tabC = document.getElementById('tableroContainer');
    if(tabC) tabC.classList.remove('panico');
    const barra = document.getElementById('barraTiempo');
    if(barra) barra.style.width = '100%';
    const btnRep = document.getElementById('btnRepetir');
    if(btnRep) btnRep.disabled = true;
    const estado = document.getElementById('estado');
    if(estado) estado.innerText = '¡Excelente!';
    
    if (modoActual === 'caos') {
      setTimeout(barajarTableroCaos, 500);
    } else {
      setTimeout(sigNivel, 700);
    }
  }
}

function barajarTableroCaos() {
  const temaSel = document.getElementById('temaColor');
  const paleta = temas[temaSel ? temaSel.value : 'bosque'];
  document.querySelectorAll('.bloque').forEach(b => {
    b.style.background = paleta[Math.floor(Math.random() * paleta.length)];
  });
  setTimeout(sigNivel, 400);
}

function perderPartida(mensajeCustom) {
  lock = true;
  clearInterval(temporizadorTurno);
  const tabC = document.getElementById('tableroContainer');
  if(tabC) tabC.classList.remove('panico');
  sonido(-1, 600); vibrar(300);
  const pts = modoActual === 'supervivencia' ? lvl : lvl - 1;
  const estado = document.getElementById('estado');
  if(estado) estado.innerText = mensajeCustom || `¡Juego Terminado! Nivel alcanzado: ${Math.max(0, pts)}`;
  
  const difSel = document.getElementById('dificultad');
  const modSel = document.getElementById('modoJuego');
  if(difSel) difSel.disabled = false;
  if(modSel) modSel.disabled = false;
  
  const btnRep = document.getElementById('btnRepetir');
  if(btnRep) btnRep.style.display = 'none';
  const barra = document.getElementById('barraTiempo');
  if(barra) barra.style.width = '100%';
  
  const btn = document.getElementById('btn');
  if(btn) {
    btn.innerText = 'Volver a intentar';
    btn.style.display = 'block';
  }
}
</script>
</body>
</html>
