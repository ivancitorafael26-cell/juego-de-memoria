<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memoria de Bloques Pro</title>
<style>
  :root {
    --bg-main: #0f1115;
    --panel-bg: rgba(22, 27, 34, 0.75);
    --border-color: rgba(255, 255, 255, 0.1);
    --text-main: #f0f3f6;
    --text-muted: #8b949e;
    --accent: #3b82f6;
  }

  body.modo-claro {
    --bg-main: #f0f3f6;
    --panel-bg: rgba(255, 255, 255, 0.85);
    --border-color: rgba(0, 0, 0, 0.1);
    --text-main: #0f1115;
    --text-muted: #57606a;
  }

  body {
    background: var(--bg-main);
    color: var(--text-main);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    user-select: none;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .top-bar {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
    pointer-events: none;
  }
  .top-bar > * { pointer-events: auto; }

  .record-badge {
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }

  .grupo-botones-top { display: flex; gap: 8px; }

  .btn-vista {
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--border-color);
    border-radius: 20px;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    color: var(--text-main);
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    transition: 0.2s;
  }
  .btn-vista:hover { background: rgba(128,128,128,0.15); }

  h1 { margin: 10px 0 5px; font-size: 28px; font-weight: 800; text-align: center; letter-spacing: -0.5px; }
  #estado { font-size: 15px; margin-bottom: 5px; color: var(--text-muted); height: 24px; text-align: center; font-weight: 500; }
  
  #vidasContainer {
    font-size: 18px;
    height: 28px;
    text-align: center;
    margin-bottom: 10px;
    display: none;
    letter-spacing: 4px;
  }

  .controles {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 18px;
    max-width: 680px;
  }

  select {
    padding: 9px 12px;
    font-size: 13px;
    font-weight: 500;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    color: var(--text-main);
    cursor: pointer;
    outline: none;
    transition: 0.2s;
  }
  select:hover { border-color: rgba(128,128,128,0.3); }

  .tablero-container {
    position: relative;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    padding: 20px;
    border-radius: 24px;
    border: 1px solid var(--border-color);
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    transition: 0.3s;
    overflow: hidden;
    min-width: 320px;
    min-height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tablero-container.panico {
    animation: latidoPanico 0.4s infinite alternate;
    border-color: #ef4444 !important;
  }
  @keyframes latidoPanico {
    from { box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
    to { box-shadow: 0 0 25px rgba(239, 68, 68, 0.9); }
  }

  .barra-tiempo {
    position: absolute;
    top: 0; left: 0; height: 4px; background: var(--accent);
    border-radius: 24px 24px 0 0; width: 100%;
    transition: width 0.05s linear, background-color 0.2s;
    display: none;
    z-index: 10;
  }

  .tablero { 
    display: grid; 
    grid-template-columns: repeat(3, 105px); 
    grid-gap: 12px; 
  }

  .bloque {
    border-radius: 14px;
    cursor: pointer;
    opacity: 0.4;
    width: 105px;
    height: 105px;
    transition: transform 0.1s ease, opacity 0.15s ease, box-shadow 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .bloque:hover { opacity: 0.6; }
  .iluminado {
    opacity: 1 !important;
    transform: scale(1.04);
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.9);
  }

  .acciones {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    justify-content: center;
    width: 100%;
    max-width: 380px;
  }

  .acciones button {
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
  }
  #btn { background: var(--text-main); color: var(--bg-main); flex: 1; box-shadow: 0 4px 15px rgba(255,255,255,0.15); }
  #btn:hover { opacity: 0.9; transform: translateY(-1px); }
  #btnRepetir { background: #eab308; color: #0f1115; display: none; }
  #btnRepetir:disabled { background: var(--border-color); color: var(--text-muted); cursor: not-allowed; }

  .btn-grabacion { background: #ef4444; color: #fff; display: none; }
  .btn-grabacion.grabando { background: #dc2626; animation: pulseRec 1s infinite alternate; }
  @keyframes pulseRec { from { opacity: 1; } to { opacity: 0.6; } }
  .btn-reproducir { background: #10b981; color: #fff; display: none; }
  .btn-reproducir:disabled { background: var(--border-color); color: var(--text-muted); cursor: not-allowed; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="record-badge" id="recordBadge">🏆 Récord: 0</div>
  <div class="grupo-botones-top">
    <button class="btn-vista" onclick="alternarTemaClaroDark()" id="btnTemaClaro">☀️ Claro</button>
    <button class="btn-vista" id="btnVista" onclick="alternarVista()">💻 Escritorio</button>
  </div>
</div>

<h1>Memoria de Bloques</h1>
<div id="estado">Selecciona opciones y presiona Jugar</div>
<div id="vidasContainer">❤️❤️❤️</div>

<div class="controles">
  <select id="modoJuego" onchange="cambiarModo()">
    <option value="clasico" selected>🕹️ Modo: Clásico</option>
    <option value="inverso">🔄 Modo: Espejo (Inverso)</option>
    <option value="contrarreloj">⏱️ Modo: Contrarreloj</option>
    <option value="caos">⚡ Modo: Caos (Aleatorio)</option>
    <option value="supervivencia">🛡️ Modo: Supervivencia (3 Vidas)</option>
    <option value="libre">🎹 Modo: Melodía Libre & Grabadora</option>
  </select>

  <select id="dificultad" onchange="cambiarDificultad()">
    <option value="facil">🟢 Dificultad: Fácil (4 bloques)</option>
    <option value="normal" selected>🟡 Dificultad: Normal (6 bloques)</option>
    <option value="dificil">🟠 Dificultad: Difícil (9 bloques)</option>
    <option value="extremo">🔴 Dificultad: Extremo (15 bloques - 3x5)</option>
  </select>

  <select id="tipoSonido" onchange="probarSonido()">
    <option value="melodia" selected>🎶 Sonido: Melodía</option>
    <option value="piano">🎹 Sonido: Piano</option>
    <option value="campana">🔔 Sonido: Campana</option>
    <option value="laser">🚀 Sonido: Láser</option>
    <option value="gota">💧 Sonido: Gota de Agua</option>
    <option value="violin">🎻 Sonido: Violín</option>
    <option value="guitarra">🎸 Sonido: Guitarra</option>
    <option value="explosion">💥 Sonido: Explosión</option>
    <option value="timbre">🛎️ Sonido: Timbre</option>
    <option value="maullido">🐱 Sonido: Maullido</option>
  </select>

  <select id="temaColor" onchange="aplicarTema()">
    <option value="bosque" selected>🌿 Tema: Bosque Mágico</option>
    <option value="pastel">🌸 Tema: Rosa Pastel</option>
    <option value="galaxia">🌌 Tema: Galaxia</option>
    <option value="tecnologico">💻 Tema: Tecnológico</option>
    <option value="esmeralda">🌲 Tema: Esmeralda</option>
    <option value="atardecer">🌅 Tema: Atardecer</option>
    <option value="neon">⚡ Tema: Neón</option>
  </select>
</div>

<div class="tablero-container" id="tableroContainer">
  <div class="barra-tiempo" id="barraTiempo"></div>
  <div class="tablero" id="tablero"></div>
</div>

<div class="acciones">
  <button id="btn" onclick="iniciar()">Jugar</button>
  <button id="btnRepetir" onclick="usarRepetir()">🔁 Repetir (1)</button>
  <button id="btnGrabar" class="btn-grabacion" onclick="toggleGrabacion()">🔴 Grabar</button>
  <button id="btnReproducerMelodia" class="btn-reproducir" onclick="reproducirMelodiaGrabada()" disabled>▶️ Escuchar</button>
</div>

<script>
const temas = {
  bosque:      ['#00ff66', '#10b981', '#00e676', '#00c853', '#76ff03', '#69f0ae', '#00bfa5', '#aeea00'],
  pastel:      ['#ff4081', '#ff80ab', '#e040fb', '#d500f9', '#7c4dff', '#ff1744', '#aa00ff', '#ff6d00'],
  galaxia:     ['#00b0ff', '#2979ff', '#651fff', '#f50057', '#00e5ff', '#3d5afe', '#e040fb', '#0091ea'],
  tecnologico: ['#0070ff', '#00e5ff', '#2979ff', '#00b0ff', '#0091ea', '#536dfe', '#2962ff', '#00d2ff'],
  esmeralda:   ['#00c853', '#00e676', '#1de9b6', '#00b0ff', '#69f0ae', '#00bfa5', '#00e676', '#10b981'],
  atardecer:   ['#ff3d00', '#ff6d00', '#ffea00', '#f50057', '#ff9100', '#ff1744', '#ffab00', '#ff2a00'],
  neon:        ['#d500f9', '#f50057', '#00e5ff', '#00e676', '#ffea00', '#651fff', '#1de9b6', '#ff6d00']
};

const notas = [261.6, 293.6, 329.6, 349.2, 392.0, 440.0, 493.8, 523.2, 587.3, 659.2, 698.4, 783.9, 830.6, 880.0, 932.3];
const niveles = {
  facil:   { cant: 4,  col: 2, tam: 120, vel: 700, nom: 'Fácil' },
  normal:  { cant: 6,  col: 3, tam: 105, vel: 580, nom: 'Normal' },
  dificil: { cant: 9,  col: 3, tam: 90,  vel: 450, nom: 'Difícil' },
  extremo: { cant: 15, col: 3, tam: 65,  vel: 320, nom: 'Extremo (3x5)' }
};

let cfg = niveles.normal, seq = [], usr = [], lvl = 0, lock = true, ctx = null;
let esMovil = false, comodinDisponible = true;
let modoActual = 'clasico';
let esClaro = localStorage.getItem('simon_modo_claro') === 'true';
let vidas = 3;
let temporizadorTurno = null;
let tiempoRestante = 100;

let estaGrabando = false;
let melodiaGrabada = [];
let tiempoInicioGrabacion = 0;

window.addEventListener('DOMContentLoaded', () => {
  if (esClaro) {
    document.body.classList.add('modo-claro');
    const btnT = document.getElementById('btnTemaClaro');
    if(btnT) btnT.innerText = '🌙 Oscuro';
  }
  actualizarVistaRecord();
  aplicarTema();
  armarTablero();
});

function obtenerClaveRecord() {
  const difSel = document.getElementById('dificultad');
  const dif = difSel ? difSel.value : 'normal';
  return 'simon_record_' + dif;
}

function obtenerRecordActual() {
  return parseInt(localStorage.getItem(obtenerClaveRecord()) || '0', 10);
}

function actualizarVistaRecord() {
  const badge = document.getElementById('recordBadge');
  const difSel = document.getElementById('dificultad');
  const nombreDif = difSel ? difSel.options[difSel.selectedIndex].text.split('(')[0].trim().replace(/^[🟢🟡🟠🔴]\s*/, '') : 'Normal';
  if(badge) badge.innerText = `🏆 Récord (${nombreDif}): ${obtenerRecordActual()}`;
}

function cambiarDificultad() {
  actualizarVistaRecord();
  armarTablero();
}

function comprobarRecord(puntuacion) {
  const clave = obtenerClaveRecord();
  const recordActual = obtenerRecordActual();
  if (puntuacion > recordActual) {
    localStorage.setItem(clave, puntuacion);
    actualizarVistaRecord();
  }
}

function alternarTemaClaroDark() {
  esClaro = !esClaro;
  document.body.classList.toggle('modo-claro', esClaro);
  localStorage.setItem('simon_modo_claro', esClaro);
  const btnT = document.getElementById('btnTemaClaro');
  if(btnT) btnT.innerText = esClaro ? '🌙 Oscuro' : '☀️ Claro';
}

function vibrar(patron) {
  if (navigator.vibrate) { try { navigator.vibrate(patron); } catch (e) {} }
}

function aplicarTema() {
  const temaSel = document.getElementById('temaColor');
  const paleta = temas[temaSel ? temaSel.value : 'bosque'] || temas.bosque;
  if(paleta && paleta[0]) {
    document.documentElement.style.setProperty('--accent', paleta[0]);
  }
  armarTablero();
}

function alternarVista() {
  esMovil = !esMovil;
  const btn = document.getElementById('btnVista');
  if(btn) btn.innerText = esMovil ? '💻 Escritorio' : '📱 Móvil';
  armarTablero();
}

function armarTablero() {
  const difSel = document.getElementById('dificultad');
  cfg = niveles[difSel ? difSel.value : 'normal'] || niveles.normal;
  const temaSel = document.getElementById('temaColor');
  const paleta = temas[temaSel ? temaSel.value : 'bosque'] || temas.bosque;
  const tab = document.getElementById('tablero');
  if (!tab) return;
  
  tab.innerHTML = '';
  let tamFinal = cfg.tam;
  if (esMovil) {
    const anchoDisp = Math.min(window.innerWidth - 60, 340);
    tamFinal = Math.floor((anchoDisp - (cfg.col - 1) * 10) / cfg.col);
  }
  tab.style.gridTemplateColumns = `repeat(${cfg.col}, ${tamFinal}px)`;
  
  for (let i = 0; i < cfg.cant; i++) {
    const d = document.createElement('div');
    d.className = 'bloque'; 
    d.id = 'b' + i;
    d.style.background = paleta[i % paleta.length];
    d.style.width = tamFinal + 'px'; 
    d.style.height = tamFinal + 'px';
    
    d.addEventListener('touchstart', (e) => {
      e.preventDefault();
      tocar(i);
    }, {passive: false});
    d.onclick = () => tocar(i);

    tab.appendChild(d);
  }
}

function cambiarModo() {
  const modoEl = document.getElementById('modoJuego');
  if (!modoEl) return;
  modoActual = modoEl.value;
  const barra = document.getElementById('barraTiempo');
  const btnJugar = document.getElementById('btn');
  const estado = document.getElementById('estado');
  const vidasContainer = document.getElementById('vidasContainer');
  const btnRep = document.getElementById('btnRepetir');
  const btnGrabar = document.getElementById('btnGrabar');
  const btnReproducer = document.getElementById('btnReproducerMelodia');
  
  clearInterval(temporizadorTurno);
  if(barra) barra.style.display = (modoActual === 'contrarreloj') ? 'block' : 'none';
  if(vidasContainer) vidasContainer.style.display = (modoActual === 'supervivencia') ? 'block' : 'none';
  const tabContainer = document.getElementById('tableroContainer');
  if(tabContainer) tabContainer.classList.remove('panico');

  estaGrabando = false;
  melodiaGrabada = [];
  if(btnGrabar) {
    btnGrabar.classList.remove('grabando');
    btnGrabar.innerText = '🔴 Grabar';
  }

  if (modoActual === 'libre') {
    lock = false;
    if(btnJugar) btnJugar.style.display = 'none';
    if(btnRep) btnRep.style.display = 'none';
    if(btnGrabar) btnGrabar.style.display = 'block';
    if(btnReproducer) btnReproducer.style.display = 'block';
    if(estado) estado.innerText = '🎹 Modo Libre: Toca o graba tu propia melodía';
    document.querySelectorAll('.bloque').forEach(b => b.style.opacity = '0.8');
  } else {
    lock = true;
    if(btnJugar) btnJugar.style.display = 'block';
    if(btnGrabar) btnGrabar.style.display = 'none';
    if(btnReproducer) btnReproducer.style.display = 'none';
    if(estado) estado.innerText = 'Selecciona opciones y presiona Jugar';
    document.querySelectorAll('.bloque').forEach(b => b.style.opacity = '0.4');
  }
}

function toggleGrabacion() {
  const btnGrabar = document.getElementById('btnGrabar');
  const btnReproducer = document.getElementById('btnReproducerMelodia');
  const estado = document.getElementById('estado');

  if (!estaGrabando) {
    estaGrabando = true;
    melodiaGrabada = [];
    tiempoInicioGrabacion = Date.now();
    if(btnGrabar) {
      btnGrabar.classList.add('grabando');
      btnGrabar.innerText = '⏹️ Detener';
    }
    if(btnReproducer) btnReproducer.disabled = true;
    if(estado) estado.innerText = '🔴 Grabando melodía... ¡Toca los bloques!';
  } else {
    estaGrabando = false;
    if(btnGrabar) {
      btnGrabar.classList.remove('grabando');
      btnGrabar.innerText = '🔴 Grabar';
    }
    if(melodiaGrabada.length > 0) {
      if(btnReproducer) btnReproducer.disabled = false;
      if(estado) estado.innerText = `✅ ¡Melodía grabada (${melodiaGrabada.length} notas)!`;
    } else {
      if(estado) estado.innerText = '🎹 Modo Libre: No grabaste ninguna nota';
    }
  }
}

function reproducirMelodiaGrabada() {
  if (melodiaGrabada.length === 0 || lock) return;
  lock = true;
  const estado = document.getElementById('estado');
  if(estado) estado.innerText = '▶️ Reproduciendo tu melodía...';

  melodiaGrabada.forEach((item) => {
    setTimeout(() => {
      luz(item.bloque, 300);
    }, item.tiempo);
  });

  const tiempoTotal = melodiaGrabada[melodiaGrabada.length - 1].tiempo + 400;
  setTimeout(() => {
    lock = false;
    if(estado) estado.innerText = '🎹 Reproducción finalizada';
  }, tiempoTotal);
}

function sonido(i, ms) {
  try {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime, dur = ms / 1000;
    const tipoSel = document.getElementById('tipoSonido');
    const tipo = tipoSel ? tipoSel.value : 'melodia';
    const f = i === -1 ? 90 : notas[i % notas.length];

    if (i === -1) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(130, now); o.frequency.linearRampToValueAtTime(60, now + dur);
      g.gain.setValueAtTime(0.9, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now + dur);
      return;
    }

    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = tipo === 'piano' ? 'sine' : (tipo === 'laser' ? 'sawtooth' : 'triangle');
    o.frequency.setValueAtTime(f, now);
    g.gain.setValueAtTime(0.8, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now + dur);
  } catch (e) {}
}

function probarSonido() { sonido(2, 350); }

function luz(i, customMs) {
  const el = document.getElementById('b' + i);
  if (!el) return;
  const ms = customMs || cfg.vel;
  el.classList.add('iluminado');
  sonido(i, ms);
  vibrar(40);
  setTimeout(() => el.classList.remove('iluminado'), ms * 0.7);
}

function iniciar() {
  clearInterval(temporizadorTurno);
  seq = [];
  usr = [];
  lvl = 0;
  vidas = 3;
  comodinDisponible = true;
  const btnRep = document.getElementById('btnRepetir');
  if(btnRep) {
    btnRep.style.display = 'inline-block';
    btnRep.innerText = '🔁 Repetir (1)';
    btnRep.disabled = false;
  }
  actualizarVidasUI();
  siguienteNivel();
}

function actualizarVidasUI() {
  const vCont = document.getElementById('vidasContainer');
  if(vCont) vCont.innerText = '❤️'.repeat(vidas);
}

function siguienteNivel() {
  usr = [];
  lvl++;
  const est = document.getElementById('estado');
  if(est) est.innerText = `Nivel ${lvl}`;
  
  seq.push(Math.floor(Math.random() * cfg.cant));
  reproducirSecuencia();
}

function reproducirSecuencia() {
  lock = true;
  let i = 0;
  const velActual = Math.max(200, cfg.vel - (lvl * 15));
  
  const intervalo = setInterval(() => {
    luz(seq[i], velActual);
    i++;
    if (i >= seq.length) {
      clearInterval(intervalo);
      setTimeout(() => {
        lock = false;
        if (modoActual === 'contrarreloj') iniciarContrarreloj();
      }, velActual);
    }
  }, velActual * 1.3);
}

function iniciarContrarreloj() {
  if (modoActual !== 'contrarreloj' || lock) return;
  const barra = document.getElementById('barraTiempo');
  const container = document.getElementById('tableroContainer');
  tiempoRestante = 100;
  if(barra) barra.style.width = '100%';
  if(container) container.classList.remove('panico');
  
  clearInterval(temporizadorTurno);
  let duracionTotal = Math.max(3000, 8000 - (lvl * 300));
  let intervaloMs = 50;
  let decremento = (intervaloMs / duracionTotal) * 100;

  temporizadorTurno = setInterval(() => {
    if (lock) {
      clearInterval(temporizadorTurno);
      return;
    }
    tiempoRestante -= decremento;
    if(barra) barra.style.width = tiempoRestante + '%';
    
    if (tiempoRestante < 30) {
      if(container) container.classList.add('panico');
    }

    if (tiempoRestante
