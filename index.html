<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secuencia Hacker Pro</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #66fcf1;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 { color: #66fcf1; font-size: 22px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(102,252,241,0.5); }
        #estado { font-size: 15px; margin-bottom: 20px; color: #45a29e; height: 20px; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }
        
        .nodo {
            width: 90px;
            height: 90px;
            background-color: #1f2833;
            border: 3px solid #45a29e;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
        }
        .nodo:active { transform: scale(0.93); }

        /* Colores activos de los nodos */
        .activo-0 { background-color: #ff0055 !important; border-color: #ff88aa !important; box-shadow: 0 0 20px #ff0055; }
        .activo-1 { background-color: #00ffcc !important; border-color: #88ffbb !important; box-shadow: 0 0 20px #00ffcc; }
        .activo-2 { background-color: #ffcc00 !important; border-color: #ffee88 !important; box-shadow: 0 0 20px #ffcc00; }
        .activo-3 { background-color: #9900ff !important; border-color: #cc88ff !important; box-shadow: 0 0 20px #9900ff; }

        #btn {
            background-color: #66fcf1;
            color: #0b0c10;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(102,252,241,0.4);
            transition: background 0.2s;
        }
        #btn:hover { background-color: #45a29e; color: #fff; }
    </style>
</head>
<body>

    <h1>💻 SECUENCIA HACKER 🔐</h1>
    <div id="estado">¡Dale al botón para hackear el sistema!</div>

    <div class="grid" id="tablero">
        <div class="nodo" data-index="0"></div>
        <div class="nodo" data-index="1"></div>
        <div class="nodo" data-index="2"></div>
        <div class="nodo" data-index="3"></div>
        <div class="nodo" data-index="4"></div>
        <div class="nodo" data-index="5"></div>
        <div class="nodo" data-index="6"></div>
        <div class="nodo" data-index="7"></div>
        <div class="nodo" data-index="8"></div>
    </div>

    <button id="btn" onclick="iniciarJuego()">Iniciar Hackeo</button>

    <script>
        const nodos = document.querySelectorAll(".nodo");
        const estado = document.getElementById("estado");
        let secuencia = [];
        let jugadorSecuencia = [];
        let nivel = 0;
        let jugando = false;
        let coloresClase = ["activo-0", "activo-1", "activo-2", "activo-3"];

        function iniciarJuego() {
            secuencia = [];
            nivel = 0;
            siguienteNivel();
        }

        function siguienteNivel() {
            jugadorSecuencia = [];
            nivel++;
            estado.innerText = `Nivel ${nivel}: Descifrando código...`;
            
            // Añadir un nuevo nodo aleatorio al patrón
            secuencia.push(Math.floor(Math.random() * 9));
            
            mostrarSecuencia();
        }

        function mostrarSecuencia() {
            let i = 0;
            let velocidadMuestra = Math.max(300, 600 - (nivel * 25)); // Se pone más rápido cada nivel
            
            let intervalo = setInterval(() => {
                if (i > 0) {
                    let prevIdx = secuencia[i - 1];
                    nodos[prevIdx].className = "nodo";
                }
                if (i < secuencia.length) {
                    let actualIdx = secuencia[i];
                    let randomColor = coloresClase[Math.floor(Math.random() * coloresClase.length)];
                    nodos[actualIdx].classList.add(randomColor);
                    i++;
                } else {
                    clearInterval(intervalo);
                    setTimeout(() => {
                        nodos[secuencia[secuencia.length - 1]].className = "nodo";
                        estado.innerText = `⚡ ¡Tu turno! Repite el patrón`;
                        jugando = true;
                    }, 400);
                }
            }, velocidadMuestra);
        }

        nodos.forEach((nodo, index) => {
            nodo.addEventListener("click", () => {
                if (!jugando) return;

                jugadorSecuencia.push(index);
                
                // Efecto visual al tocar
                let colorToque = coloresClase[index % coloresClase.length];
                nodo.classList.add(colorToque);
                setTimeout(() => nodo.className = "nodo", 180);

                // Comprobar paso actual
                const pasoActual = jugadorSecuencia.length - 1;
                if (jugadorSecuencia[pasoActual] !== secuencia[pasoActual]) {
                    jugando = false;
                    estado.innerText = `❌ ¡ALERTA! Fallaste en el nivel ${nivel}`;
                    return;
                }

                // Si completó la secuencia de este nivel
                if (jugadorSecuencia.length === secuencia.length) {
                    jugando = false;
                    estado.innerText = `🔓 ¡Sistema hackeado! Subiendo nivel...`;
                    setTimeout(siguienteNivel, 1000);
                }
            });
        });
    </script>
</body>
</html>
