<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego de Memoria</title>
    <!-- Logo / Favicon -->
    <link rel="icon" type="image/png" href="logo.png">
    
    <style>
        :root {
            --bg-color: #1a1a2e;
            --text-color: #ffffff;
            --subtext-color: #a2a8d3;
            --btn-bg: #ffffff;
            --btn-text: #1a1a2e;
            --control-bg: #16213e;
            --control-hover: #1f305e;
            --control-text: #ffffff;
            --badge-bg: rgba(255, 255, 255, 0.1);
            --modal-bg: #16213e;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding-top: 105px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas de Lluvia Binaria y Atmósfera */
        #matrix-canvas, #atmosfera-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        #matrix-canvas {
            display: none;
            opacity: 0.22;
        }

        body.modo-hacker #matrix-canvas {
            display: block;
        }

        #atmosfera-canvas {
            z-index: 2;
        }

        .barra-superior, .app-contenedor, .modal-overlay {
            position: relative;
            z-index: 10;
        }

        /* Estilos específicos para el Modo Hacker */
        body.modo-hacker {
            background-color: #000000 !important;
        }

        body.modo-hacker .barra-superior {
            background-color: #000000 !important;
            border-bottom: 2px solid #00ff00 !important;
            box-shadow: 0 4px 20px rgba(0, 255, 0, 0.25) !important;
        }

        body.modo-hacker .btn-mini {
            background-color: #0b0f0b !important;
            color: #00ff00 !important;
            border: 1px solid #00ff00 !important;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300ff00' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") !important;
            background-repeat: no-repeat !important;
            background-position: right 10px center !important;
            background-size: 14px !important;
        }

        body.modo-hacker button.btn-mini {
            background-image: none !important;
        }

        body.modo-hacker .btn-mini:hover:not(:disabled) {
            background-color: #00ff00 !important;
            color: #000000 !important;
            box-shadow: 0 0 12px #00ff00 !important;
        }

        body.modo-hacker h1, 
        body.modo-hacker #mensaje, 
        body.modo-hacker .badge-modo {
            color: #00ff00 !important;
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.7);
        }

        body.modo-hacker .bloque {
            background-color: #0a0f0a !important;
            color: #00ff00 !important;
            box-shadow: none !important;
            border: 2px solid #00ff00 !important;
        }

        body.modo-hacker .bloque.brillar {
            background-color: #00ff00 !important;
            box-shadow: 0 0 35px #00ff00, inset 0 0 15px #ffffff !important;
            filter: brightness(1.5);
        }

        .barra-superior {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: var(--bg-color);
            padding: 10px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            z-index: 100;
            box-sizing: border-box;
            transition: background-color 0.3s ease;
        }

        .grupo-controles {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-mini {
            background-color: var(--control-bg);
            color: var(--control-text);
            border: 1px solid rgba(128, 128, 128, 0.3);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 12px;
            padding-right: 28px;
        }

        button.btn-mini {
            background-image: none;
            padding-right: 12px;
        }

        .btn-mini:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-mini:hover:not(:disabled) {
            background-color: var(--control-hover);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        #btn-silenciar {
            width: 38px;
            height: 38px;
            padding: 0;
            border-radius: 50%;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: none;
        }

        .app-contenedor {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 0 10px 30px 10px;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 1.8rem;
            letter-spacing: 1px;
            text-align: center;
        }

        .contenedor-info-partida {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .badge-modo {
            background-color: var(--badge-bg);
            border: 1px solid rgba(128, 128, 128, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--subtext-color);
            letter-spacing: 0.5px;
        }

        #mensaje {
            font-size: 1rem;
            margin-bottom: 12px;
            height: 22px;
            color: var(--subtext-color);
            font-weight: bold;
            text-align: center;
            padding: 0 10px;
        }

        .contenedor-tiempo {
            width: 260px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            margin-bottom: 12px;
            overflow: hidden;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .contenedor-tiempo.activo {
            display: block;
            opacity: 1;
        }

        .barra-progreso-tiempo {
            width: 100%;
            height: 100%;
            background-color: #2ed573;
            transition: width 0.1s linear, background-color 0.3s;
        }

        .vibrando-alerta {
            animation: vibrar-rojo 0.15s infinite alternate;
        }

        @keyframes vibrar-rojo {
            0% { transform: translate(0, 0) scale(1); background-color: #ff4757; }
            25% { transform: translate(-2px, 2px) scale(1.01); background-color: #ff3838; }
            50% { transform: translate(2px, -2px) scale(1); background-color: #ff4757; }
            75% { transform: translate(-1px, -1px) scale(1.01); background-color: #e84118; }
            100% { transform: translate(1px, 1px) scale(1); background-color: #ff4757; }
        }

        .panel-grabadora {
            display: none;
            opacity: 0;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        .panel-grabadora.activo {
            display: flex;
            opacity: 1;
        }

        .btn-grabadora {
            padding: 8px 14px;
            font-size: 0.8rem;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }
        .btn-grabadora:hover { transform: scale(1.05); }
        #btn-grabar { background-color: #ff4757; color: white; }
        #btn-grabar.grabando { background-color: #c0392b; animation: pulse 1s infinite; }
        #btn-reproducir { background-color: #2ed573; color: white; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .tablero-contenedor {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            width: 100%;
        }

        .tablero {
            display: grid;
            grid-template-columns: repeat(2, 120px);
            grid-template-rows: repeat(2, 120px);
            gap: 10px;
        }

        .bloque {
            width: 100%;
            height: 100%;
            cursor: pointer;
            opacity: 1;
            position: relative;
            z-index: 2;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.3);
            transition: transform 0.15s ease, box-shadow 0.2s ease, background-color 0.3s ease;
        }

        /* Halo expansivo hacia afuera personalizado para los cuadrados */
        .bloque::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background-color: currentColor;
            border-radius: 20px;
            z-index: -1;
            opacity: 0;
            filter: blur(12px);
            transition: opacity 0.15s ease, transform 0.15s ease;
            transform: scale(0.85);
        }

        .bloque:active {
            transform: scale(0.94);
        }

        .bloque.brillar {
            transform: scale(1.06);
            box-shadow: 0 0 35px currentColor, inset 0 0 10px rgba(255, 255, 255, 0.8);
            filter: brightness(1.3);
            z-index: 10;
        }

        .bloque.brillar::after {
            opacity: 0.95;
            transform: scale(1.25);
        }

        #btn-jugar {
            padding: 10px 32px;
            font-size: 1rem;
            font-weight: bold;
            color: var(--btn-text);
            background-color: var(--btn-bg);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.15s, opacity 0.2s;
            margin-bottom: 20px;
        }

        #btn-jugar:hover:not(:disabled) {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        #btn-jugar:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(3px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.activo {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-contenido {
            background-color: var(--modal-bg);
            color: var(--text-color);
            padding: 20px;
            border-radius: 18px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            border: 1px solid rgba(128, 128, 128, 0.25);
        }

        .modal-contenido h2 {
            margin-top: 0;
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .grid-modos-stats {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-modo-stat {
            background: rgba(128, 128, 128, 0.08);
            border: 1px solid rgba(128, 128, 128, 0.15);
            border-radius: 12px;
            padding: 10px 12px;
        }

        .card-modo-stat h3 {
            margin: 0 0 8px 0;
            font-size: 0.95rem;
            color: var(--subtext-color);
            font-weight: 700;
        }

        .grid-dificultades {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .item-dif {
            background: rgba(0, 0, 0, 0.18);
            border-radius: 8px;
            padding: 6px 4px;
            text-align: center;
            font-size: 0.75rem;
        }

        .item-dif .dif-titulo {
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-color);
            font-size: 0.75rem;
            border-bottom: 1px solid rgba(128, 128, 128, 0.2);
            padding-bottom: 2px;
        }

        .item-dif div {
            line-height: 1.3;
        }

        .item-dif span {
            font-weight: 600;
            color: var(--subtext-color);
        }

        .grid-extremo-stat {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.18);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            font-size: 0.8rem;
        }

        .grid-extremo-stat div {
            line-height: 1.3;
        }

        .grid-extremo-stat span {
            font-weight: 600;
            color: var(--subtext-color);
        }

        @media (max-width: 768px) {
            body {
                padding-top: 130px;
            }
            .barra-superior {
                padding: 8px 10px;
                justify-content: center;
            }
            .grupo-controles {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>
    <canvas id="atmosfera-canvas"></canvas>

    <div class="barra-superior">
        <div class="grupo-controles">
            <select id="selector-dificultad" class="btn-mini" onchange="cambiarDificultad(this)" title="Dificultad">
                <option value="2">Dificultad = 🟢 Fácil (2x2)</option>
                <option value="3">Dificultad = 🟡 Medio (3x3)</option>
                <option value="4">Dificultad = 🔴 Difícil (4x4)</option>
            </select>

            <select id="selector-modo" class="btn-mini" onchange="cambiarModoJuego(this)" title="Modo de Juego">
                <option value="normal">Modo = ➡️ Normal</option>
                <option value="invertido">Modo = 🔄 Invertido</option>
                <option value="relampago">Modo = ⚡ Relámpago</option>
                <option value="contrarreloj">Modo = ⏱️ Contrarreloj</option>
                <option value="libre">Modo = 🎹 Libre (5x5)</option>
                <option value="extremo">Modo = 💀 Extremo</option>
                <option value="hacker">Modo = 💻 Hacker</option>
            </select>

            <!-- Selector de Efectos Atmosféricos -->
            <select id="selector-atmosfera" class="btn-mini" onchange="cambiarAtmosfera()" title="Efectos Atmosféricos">
                <option value="0">Atmósfera = ☁️ Ninguno</option>
                <option value="1" selected>Atmósfera = 🍃 Hojas</option>
                <option value="2">Atmósfera = ❄️ Nieve</option>
                <option value="3">Atmósfera = ✨ Brillitos</option>
            </select>

            <select id="selector-sonido" class="btn-mini" onchange="reproducirSonido(0, false)" title="Instrumento">
                <option value="0">Sonido = 🎹 Piano</option>
                <option value="1" selected>Sonido = 🔔 Campanas</option>
                <option value="2">Sonido = 🌊 Onda Suave</option>
                <option value="3">Sonido = ⚡ Retro</option>
                <option value="4">Sonido = 💧 Gotas</option>
                <option value="5">Sonido = 🎸 Guitarra</option>
                <option value="6">Sonido = 🎷 Viento</option>
                <option value="7">Sonido = 🚀 Láser</option>
                <option value="8">Sonido = 🕹️ Arcade</option>
                <option value="9">Sonido = 🎶 Arpa</option>
            </select>

            <select id="selector-color-bloques" class="btn-mini" onchange="actualizarColoresTablero()" title="Tema de Colores">
                <option value="0">Tema = ⚡ Neón</option>
                <option value="1">Tema = 🌸 Pastel</option>
                <option value="2">Tema = 🌅 Atardecer</option>
                <option value="3">Tema = 🌊 Océano</option>
                <option value="4">Tema = 🌲 Bosque</option>
            </select>
        </div>

        <div class="grupo-controles">
            <button class="btn-mini" id="btn-silenciar" type="button" onclick="toggleSilenciar()" title="Silenciar / Activar sonido">🔊</button>
            <button class="btn-mini" id="btn-stats" type="button" onclick="abrirEstadisticas()">📊 Estadísticas</button>
            <button class="btn-mini" id="btn-fondo" type="button" onclick="cambiarFondo()">🖼️ Fondo</button>
        </div>
    </div>

    <!-- Modal de Estadísticas -->
    <div class="modal-overlay" id="modal-estadisticas" onclick="cerrarEstadisticasFuera(event)">
        <div class="modal-contenido" onclick="event.stopPropagation()">
            <h2>📊 Resumen de Estadísticas</h2>
            <div id="cuerpo-estadisticas"></div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn-mini" type="button" onclick="reiniciarEstadisticas()" style="flex: 1; background-color: #ff4757; color: white; padding: 8px;">🗑️ Borrar Datos</button>
                <button class="btn-mini" type="button" onclick="cerrarEstadisticas()" style="flex: 1; padding: 8px;">Cerrar</button>
            </div>
        </div>
    </div>

    <div class="app-contenedor" id="app-contenedor">
        <h1>Juego de Memoria</h1>
        <div class="contenedor-info-partida">
            <div class="badge-modo" id="badge-modo">Modo = ➡️ Normal</div>
            <div class="badge-modo" id="cronometro-juego" style="display: none;">⏱️ 00:00</div>
        </div>
        <div id="mensaje">Presiona "Jugar" para empezar</div>

        <div class="contenedor-tiempo" id="contenedor-tiempo">
            <div class="barra-progreso-tiempo" id="barra-progreso-tiempo"></div>
        </div>

        <!-- Panel de Grabadora simplificado -->
        <div class="panel-grabadora" id="panel-grabadora">
            <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
                <button class="btn-grabadora" id="btn-grabar" type="button" onclick="toggleGrabar()">🔴 Grabar</button>
                <button class="btn-grabadora" id="btn-reproducir" type="button" onclick="reproducirGrabacion()">▶️ Reproducir</button>
            </div>
        </div>

        <div class="tablero-contenedor" id="tablero-contenedor">
            <div class="tablero" id="tablero">
                <div class="bloque" id="bloque-0" style="background-color: #ff4757; color: #ff4757;" onclick="manejarClicBloque(0)"></div>
                <div class="bloque" id="bloque-1" style="background-color: #05d9e8; color: #05d9e8;" onclick="manejarClicBloque(1)"></div>
                <div class="bloque" id="bloque-2" style="background-color: #d1f7ff; color: #d1f7ff;" onclick="manejarClicBloque(2)"></div>
                <div class="bloque" id="bloque-3" style="background-color: #7700a6; color: #7700a6;" onclick="manejarClicBloque(3)"></div>
            </div>
        </div>

        <button id="btn-jugar" type="button">Jugar</button>
    </div>

    <script>
        let secuencia = [];
        let secuenciaObjetivo = [];
        let pasoUsuario = 0;
        let bloqueado = true;
        let nivel = 0;
        let audioCtx = null;
        let timeouts = [];
        let estaSilenciado = false;

        let timerPartidaInterval = null;
        let segundosPartida = 0;

        let tamanoCuadricula = 2;
        let totalBloques = 4;

        let temporizadorTurno = null;
        let intervaloProgreso = null;
        let tiempoRestante = 6000;
        const TIEMPO_MAXIMO = 6000;

        let esGrabando = false;
        let esReproduciendo = false;
        let notasGrabadas = [];
        let tiempoInicioGrabacion = 0;
        let timeoutsGrabacion = [];

        const fondosOscuros = ['#1a1a2e', '#1e1b4b', '#064e3b', '#31102f', '#18181b', '#2e0854', '#581c87'];
        let indiceFondo = 0;

        // Lógica de lluvia binaria (Modo Hacker)
        const canvasMatrix = document.getElementById('matrix-canvas');
        const ctxMatrix = canvasMatrix.getContext('2d');
        let matrixInterval = null;

        function iniciarMatrizHacker() {
            canvasMatrix.width = window.innerWidth;
            canvasMatrix.height = window.innerHeight;
            const fontSize = 16;
            const columns = Math.floor(canvasMatrix.width / fontSize);
            const drops = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = 1;
            }

            if (matrixInterval) clearInterval(matrixInterval);
            matrixInterval = setInterval(() => {
                ctxMatrix.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctxMatrix.fillRect(0, 0, canvasMatrix.width, canvasMatrix.height);

                ctxMatrix.fillStyle = '#00ff00';
                ctxMatrix.font = fontSize + 'px monospace';

                for (let i = 0; i < drops.length; i++) {
                    const text = Math.random() > 0.5 ? '1' : '0';
                    ctxMatrix.fillText(text, i * fontSize, drops[i] * fontSize);

                    if (drops[i] * fontSize > canvasMatrix.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }, 50);
        }

        function detenerMatrizHacker() {
            if (matrixInterval) {
                clearInterval(matrixInterval);
                matrixInterval = null;
            }
            if (ctxMatrix && canvasMatrix) {
                ctxMatrix.clearRect(0, 0, canvasMatrix.width, canvasMatrix.height);
            }
        }

        // Lógica de Efectos Atmosféricos
        const canvasAtmos = document.getElementById('atmosfera-canvas');
        const ctxAtmos = canvasAtmos.getContext('2d');
        let atmosParticles = [];
        let atmosAnimId = null;

        function iniciarAtmosfera() {
            canvasAtmos.width = window.innerWidth;
            canvasAtmos.height = window.innerHeight;
            
            const selector = document.getElementById('selector-atmosfera');
            const tipo = selector ? parseInt(selector.value, 10) : 0;

            if (tipo === 0) {
                ctxAtmos.clearRect(0, 0, canvasAtmos.width, canvasAtmos.height);
                if (atmosAnimId) cancelAnimationFrame(atmosAnimId);
                return;
            }

            atmosParticles = [];
            const count = (tipo === 1) ? 18 : 35; 
            const coloresHojas = ['#2ed573', '#26de81', '#20bf6b', '#4cd137', '#44bd32'];
            const coloresBrillitos = ['#ffd700', '#fffa65', '#ffaf40', '#ffffff', '#7efff5'];

            for (let i = 0; i < count; i++) {
                atmosParticles.push({
                    x: Math.random() * canvasAtmos.width,
                    y: Math.random() * canvasAtmos.height,
                    size: Math.random() * 8 + 5,
                    speedY: tipo === 1 ? (Math.random() * 1.2 + 0.4) : (tipo === 2 ? (Math.random() * 2 + 1) : (Math.random() * 0.8 - 0.4)),
                    speedX: tipo === 1 ? (Math.random() * 1.5 - 0.75) : (tipo === 2 ? (Math.random() * 0.5 - 0.25) : (Math.random() * 1.5 - 0.75)),
                    rotation: Math.random() * 360,
                    rotSpeed: Math.random() * 2 - 1,
                    opacity: Math.random() * 0.6 + 0.3,
                    color: tipo === 1 ? coloresHojas[Math.floor(Math.random() * coloresHojas.length)] : (tipo === 2 ? '#ffffff' : coloresBrillitos[Math.floor(Math.random() * coloresBrillitos.length)])
                });
            }

            if (atmosAnimId) cancelAnimationFrame(atmosAnimId);
            animarAtmosfera(tipo);
        }

        function animarAtmosfera(tipo) {
            ctxAtmos.clearRect(0, 0, canvasAtmos.width, canvasAtmos.height);

            atmosParticles.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX + Math.sin(p.y * 0.02) * 0.5;
                p.rotation += p.rotSpeed;

                if (p.y > canvasAtmos.height + 20) {
                    p.y = -20;
                    p.x = Math.random() * canvasAtmos.width;
                }
                if (p.x > canvasAtmos.width + 20) p.x = -20;
                if (p.x < -20) p.x = canvasAtmos.width + 20;

                ctxAtmos.save();
                ctxAtmos.translate(p.x, p.y);
                ctxAtmos.rotate((p.rotation * Math.PI) / 180);
                ctxAtmos.globalAlpha = p.opacity;

                if (tipo === 1) {
                    ctxAtmos.fillStyle = p.color;
                    ctxAtmos.beginPath();
                    ctxAtmos.ellipse(0, 0, p.size, p.size / 2.2, Math.PI / 4, 0, Math.PI * 2);
                    ctxAtmos.fill();
                } else if (tipo === 2) {
                    ctxAtmos.fillStyle = p.color;
                    ctxAtmos.beginPath();
                    ctxAtmos.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                    ctxAtmos.fill();
                } else if (tipo === 3) {
                    let grad = ctxAtmos.createRadialGradient(0, 0, 0, 0, 0, p.size);
                    grad.addColorStop(0, p.color);
                    grad.addColorStop(1, 'transparent');
                    ctxAtmos.fillStyle = grad;
                    ctxAtmos.beginPath();
                    ctxAtmos.arc(0, 0, p.size, 0, Math.PI * 2);
                    ctxAtmos.fill();
                }

                ctxAtmos.restore();
            });

            atmosAnimId = requestAnimationFrame(() => animarAtmosfera(tipo));
        }

                iniciarMatrizHacker();
            } else {
                document.body.classList.remove('modo-hacker');
                detenerMatrizHacker();
            }

            construirTablero();
        }

        function cambiarFondo() {
            const selectorModo = document.getElementById('selector-modo');
            if (selectorModo && selectorModo.value === 'hacker') return;

            indiceFondo = (indiceFondo + 1) % fondosOscuros.length;
            document.body.style.backgroundColor = fondosOscuros[indiceFondo];
        }

        function limpiarTimeouts() {
            timeouts.forEach(t => clearTimeout(t));
            timeouts = [];
        }

        function detenerContadorTiempo() {
            if (temporizadorTurno) clearTimeout(temporizadorTurno);
            if (intervaloProgreso) clearInterval(intervaloProgreso);
            const barra = document.getElementById('barra-progreso-tiempo');
            if (barra) {
                barra.classList.remove('vibrando-alerta');
                barra.style.width = '100%';
                barra.style.backgroundColor = '#2ed573';
            }
        }

        function iniciarContadorContrarreloj() {
            detenerContadorTiempo();
            const modo = document.getElementById('selector-modo').value;
            if (modo !== 'contrarreloj') return;

            tiempoRestante = TIEMPO_MAXIMO;
            const barra = document.getElementById('barra-progreso-tiempo');

            intervaloProgreso = setInterval(() => {
                tiempoRestante -= 50;
                let porcentaje = (tiempoRestante / TIEMPO_MAXIMO) * 100;
                if (porcentaje < 0) porcentaje = 0;
                if (barra) barra.style.width = `${porcentaje}%`;

                if (tiempoRestante <= 2000) {
                    if (barra) barra.classList.add('vibrando-alerta');
                } else {
                    if (barra) {
                        barra.classList.remove('vibrando-alerta');
                        barra.style.backgroundColor = '#2ed573';
                    }
                }
            }, 50);

            temporizadorTurno = setTimeout(() => {
                perderPartidaPorTiempo();
            }, TIEMPO_MAXIMO);
        }

        function perderPartidaPorTiempo() {
            bloqueado = true;
            limpiarTimeouts();
            detenerContadorTiempo();
            detenerCronometroPartida();
            reproducirSonido(0, true);

            const modo = document.getElementById('selector-modo').value;
            const dif = document.getElementById('selector-dificultad').value;

            if (modo === 'extremo' || modo === 'hacker') {
                if (estadisticas[modo]) {
                    estadisticas[modo].derrotas = (estadisticas[modo].derrotas || 0) + 1;
                    guardarStats();
                }
            } else {
                if (estadisticas[modo] && estadisticas[modo][dif]) {
                    estadisticas[modo][dif].derrotas = (estadisticas[modo][dif].derrotas || 0) + 1;
                    guardarStats();
                }
            }

            const mensaje = document.getElementById('mensaje');
            if (mensaje) mensaje.textContent = `⏱️ ¡Se acabó el tiempo! Llegaste al nivel ${nivel}.`;
            secuencia = [];
            secuenciaObjetivo = [];

            const selectDif = document.getElementById('selector-dificultad');
            const selectModo = document.getElementById('selector-modo');
            if (selectDif && modo !== 'extremo' && modo !== 'hacker') selectDif.disabled = false;
            if (selectModo) selectModo.disabled = false;

            const btn = document.getElementById('btn-jugar');
            if (btn) {
                btn.textContent = "Volver a jugar";
                btn.disabled = false;
            }
        }

        function quitarBrilloTotal() {
            const bloques = document.querySelectorAll('.bloque');
            bloques.forEach(b => {
                b.classList.remove('brillar');
            });
        }

        function inicializarAudio() {
            try {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) audioCtx = new AudioContextClass();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {}
        }

        function reproducirSonido(indice, esError = false) {
            if (estaSilenciado) return;
            try {
                inicializarAudio();
                if (!audioCtx) return;

                const selectorSonido = document.getElementById('selector-sonido');
                const selectorModo = document.getElementById('selector-modo');

                let tipoSonido = selectorSonido ? parseInt(selectorSonido.value, 10) : 1;
                const modo = selectorModo ? selectorModo.value : 'normal';

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const freq = escalaNotas[indice % escalaNotas.length];

                let volumenAlto = 0.5;
                let duracionSonido = 0.35;

                if (modo === 'extremo') {
                    duracionSonido = 0.1;
                } else if (modo === 'relampago') {
                    duracionSonido = 0.2;
                }

                if (esError) {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.4 * volumenAlto, audioCtx.currentTime + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.41);
                    return;
                }

                switch (tipoSonido) {
                    case 0: osc.type = 'sine'; osc.frequency.setValueAtTime(freq, audioCtx.currentTime); break;
                    case 1: osc.type = 'triangle'; osc.frequency.setValueAtTime(freq * 1.5, audioCtx.currentTime); break;
                    case 2: osc.type = 'sine'; osc.frequency.setValueAtTime(freq * 0.75, audioCtx.currentTime); break;
                    case 3: osc.type = 'square'; osc.frequency.setValueAtTime(freq, audioCtx.currentTime); break;
                    case 4: 
                        osc.type = 'sine'; 
                        osc.frequency.setValueAtTime(freq * 0.8, audioCtx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(freq * 1.4, audioCtx.currentTime + (duracionSonido * 0.6)); 
                        break;
                    case 5: osc.type = 'sawtooth'; osc.frequency.setValueAtTime(freq, audioCtx.currentTime); break;
                    case 6: 
                        osc.type = 'triangle'; 
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                        osc.frequency.linearRampToValueAtTime(freq * 1.02, audioCtx.currentTime + (duracionSonido * 0.4)); 
                        break;
                    case 7: 
                        osc.type = 'sawtooth'; 
                        osc.frequency.setValueAtTime(freq * 2, audioCtx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + duracionSonido); 
                        break;
                    case 8: osc.type = 'square'; osc.frequency.setValueAtTime(freq * 1.25, audioCtx.currentTime); break;
                    case 9: osc.type = 'sine'; osc.frequency.setValueAtTime(freq * 1.25, audioCtx.currentTime); break;
                }

                gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.4 * volumenAlto, audioCtx.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracionSonido);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duracionSonido + 0.01);
            } catch (e) {}
        }

        function crearChispasBloque(bloqueEl) {
            if (!bloqueEl) return;
            const rect = bloqueEl.getBoundingClientRect();
            const centroX = rect.left + rect.width / 2;
            const centroY = rect.top + rect.height / 2;
            const color = bloqueEl.style.backgroundColor || '#ffffff';

            const contenedor = document.createElement('div');
            contenedor.style.position = 'fixed';
            contenedor.style.top = '0';
            contenedor.style.left = '0';
            contenedor.style.width = '100vw';
            contenedor.style.height = '100vh';
            contenedor.style.pointerEvents = 'none';
            contenedor.style.zIndex = '9999';
            document.body.appendChild(contenedor);

            for (let i = 0; i < 10; i++) {
                const chispa = document.createElement('div');
                chispa.style.position = 'absolute';
                chispa.style.width = `${Math.random() * 6 + 4}px`;
                chispa.style.height = `${Math.random() * 6 + 4}px`;
                chispa.style.backgroundColor = color;
                chispa.style.left = `${centroX}px`;
                chispa.style.top = `${centroY}px`;
                chispa.style.borderRadius = '50%';
                chispa.style.boxShadow = `0 0 8px ${color}`;
                contenedor.appendChild(chispa);

                const angulo = Math.random() * Math.PI * 2;
                const velocidad = Math.random() * 70 + 25;
                const destX = Math.cos(angulo) * velocidad;
                const destY = Math.sin(angulo) * velocidad;

                chispa.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${destX}px, ${destY}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 500 + Math.random() * 300,
                    easing: 'ease-out'
                });
            }

            setTimeout(() => contenedor.remove(), 800);
        }

        function activarBloque(id) {
            const bloque = document.getElementById(`bloque-${id}`);
            if (!bloque) return;

            bloque.classList.add('brillar');
            reproducirSonido(id, false);
            crearChispasBloque(bloque);

            const selectorModo = document.getElementById('selector-modo');
            const modo = selectorModo ? selectorModo.value : 'normal';
            let tiempoBrillo = 220;
            if (modo === 'extremo') tiempoBrillo = 90;
            else if (modo === 'relampago') tiempoBrillo = 150;

            const t = setTimeout(() => {
                if (bloque) {
                    bloque.classList.remove('brillar');
                }
            }, tiempoBrillo);
            timeouts.push(t);
        }

        function iniciarJuego() {
            inicializarAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            limpiarTimeouts();
            detenerContadorTiempo();
            quitarBrilloTotal();
            secuencia = [];
            secuenciaObjetivo = [];
            nivel = 0;

            const selectDif = document.getElementById('selector-dificultad');
            const selectModo = document.getElementById('selector-modo');
            const btnJugar = document.getElementById('btn-jugar');

            if (selectDif && selectModo.value !== 'extremo' && selectModo.value !== 'hacker') selectDif.disabled = true;
            if (selectModo) selectModo.disabled = true;
            if (btnJugar) btnJugar.disabled = true;

            const modo = selectModo ? selectModo.value : 'normal';
            const contenedorTiempo = document.getElementById('contenedor-tiempo');
            if (modo === 'contrarreloj' && contenedorTiempo) {
                contenedorTiempo.classList.add('activo');
            }

            iniciarCronometroPartida();
            siguienteRonda();
        }

        function siguienteRonda() {
            bloqueado = true;
            detenerContadorTiempo();
            pasoUsuario = 0;
            nivel++;

            const selectorModo = document.getElementById('selector-modo');
            const modo = selectorModo ? selectorModo.value : 'normal';
            const dif = document.getElementById('selector-dificultad').value;
            const mensaje = document.getElementById('mensaje');

            if (modo === 'extremo' || modo === 'hacker') {
                if (estadisticas[modo]) {
                    if (nivel > (estadisticas[modo].nivel || 0)) {
                        estadisticas[modo].nivel = nivel;
                        guardarStats();
                    }
                }
            } else {
                if (estadisticas[modo] && estadisticas[modo][dif]) {
                    if (nivel > (estadisticas[modo][dif].nivel || 0)) {
                        estadisticas[modo][dif].nivel = nivel;
                        guardarStats();
                    }
                }
            }

            let velocidadPaso = 650;
            if (modo === 'relampago') velocidadPaso = 350;
            if (modo === 'extremo') velocidadPaso = 250;

            if (modo === 'extremo') {
                let nuevoTamano = 2;
                if (nivel <= 3) nuevoTamano = 2;
                else if (nivel <= 6) nuevoTamano = 3;
                else if (nivel <= 9) nuevoTamano = 4;
                else nuevoTamano = 5;

                if (nuevoTamano !== tamanoCuadricula) {
                    tamanoCuadricula = nuevoTamano;
                    construirTablero();
                }

                indiceFondo = (indiceFondo + 1) % fondosOscuros.length;
                document.body.style.backgroundColor = fondosOscuros[indiceFondo];

                let etapaNombre = "🟢 Fácil (2x2)";
                if (nivel > 3 && nivel <= 6) etapaNombre = "🟡 Medio (3x3)";
                else if (nivel > 6 && nivel <= 9) etapaNombre = "🔴 Difícil (4x4)";
                else if (nivel > 9) etapaNombre = "💀 Extremo Total (5x5)";

                if (mensaje) mensaje.textContent = `💀 Nivel ${nivel} [${etapaNombre}] — ¡Atento!`;
            } else if (modo === 'hacker') {
                if (mensaje) mensaje.textContent = `💻 Nivel ${nivel} (Modo Hacker 2x2) — Sistema comprometido`;
            } else if (modo === 'relampago') {
                if (mensaje) mensaje.textContent = `⚡ Nivel ${nivel} (⚡ Relámpago) — ¡Rápido!`;
            } else if (modo === 'contrarreloj') {
                if (mensaje) mensaje.textContent = `⏱️ Nivel ${nivel} (⏱️ Contrarreloj) — Observa...`;
            } else {
                if (mensaje) mensaje.textContent = `Nivel ${nivel} — Observa...`;
            }

            const siguienteBloque = Math.floor(Math.random() * totalBloques);
            secuencia.push(siguienteBloque);

            if (modo === 'invertido') {
                secuenciaObjetivo = [...secuencia].reverse();
            } else {
                secuenciaObjetivo = [...secuencia];
            }

            secuencia.forEach((idBloque, index) => {
                const t = setTimeout(() => {
                    activarBloque(idBloque);
                }, (index + 1) * velocidadPaso);
                timeouts.push(t);
            });

            const tTurno = setTimeout(() => {
                bloqueado = false;
                if (modo === 'invertido') {
                    if (mensaje) mensaje.textContent = `Nivel ${nivel} — ¡Tu turno (🔄 Al revés)!`;
                } else if (modo === 'extremo') {
                    if (mensaje) mensaje.textContent = `💀 Nivel ${nivel} — ¡Tu turno!`;
                } else if (modo === 'hacker') {
                    if (mensaje) mensaje.textContent = `💻 Nivel ${nivel} — ¡Tu turno hacker!`;
                } else if (modo === 'relampago') {
                    if (mensaje) mensaje.textContent = `⚡ ¡Tu turno (⚡ Rápido)!`;
                } else if (modo === 'contrarreloj') {
                    if (mensaje) mensaje.textContent = `⏱️ ¡Tu turno! (Tienes 6 segundos)`;
                    iniciarContadorContrarreloj();
                } else {
                    if (mensaje) mensaje.textContent = `Nivel ${nivel} — ¡Tu turno!`;
                }
            }, (secuencia.length + 1) * velocidadPaso);
            timeouts.push(tTurno);
        }

        function manejarClicBloque(id) {
            const selectorModo = document.getElementById('selector-modo');
            const modo = selectorModo ? selectorModo.value : 'normal';
            const dif = document.getElementById('selector-dificultad').value;

            if (modo === 'libre') {
                activarBloque(id);
                if (esGrabando) {
                    const tiempoActual = Date.now() - tiempoInicioGrabacion;
                    notasGrabadas.push({ id: id, tiempo: tiempoActual });
                }
                return;
            }

            if (bloqueado) return;

            if (modo === 'extremo' || modo === 'hacker') {
                if (estadisticas[modo]) {
                    estadisticas[modo].notas = (estadisticas[modo].notas || 0) + 1;
                    guardarStats();
                }
            } else {
                if (estadisticas[modo] && estadisticas[modo][dif]) {
                    estadisticas[modo][dif].notas = (estadisticas[modo][dif].notas || 0) + 1;
                    guardarStats();
                }
            }

            activarBloque(id);

            if (id === secuenciaObjetivo[pasoUsuario]) {
                pasoUsuario++;
                if (pasoUsuario === secuenciaObjetivo.length) {
                    bloqueado = true;
                    detenerContadorTiempo();
                    const mensaje = document.getElementById('mensaje');
                    if (mensaje) mensaje.textContent = "¡Excelente!";

                    if (nivel % 5 === 0) {
                        mostrarBannerNivel(nivel);
                    }

                    const tiempoEspera = (nivel % 5 === 0) ? 2000 : 900;
                    const tSig = setTimeout(siguienteRonda, tiempoEspera);
                    timeouts.push(tSig);
                }
            } else {
                bloqueado = true;
                limpiarTimeouts();
                detenerContadorTiempo();
                detenerCronometroPartida();
                quitarBrilloTotal();
                reproducirSonido(0, true);

                if (modo === 'extremo' || modo === 'hacker') {
                    if (estadisticas[modo]) {
                        estadisticas[modo].derrotas = (estadisticas[modo].derrotas || 0) + 1;
                        guardarStats();
                    }
                } else {
                    if (estadisticas[modo] && estadisticas[modo][dif]) {
                        estadisticas[modo][dif].derrotas = (estadisticas[modo][dif].derrotas || 0) + 1;
                        guardarStats();
                    }
                }

                const mensaje = document.getElementById('mensaje');
                if (mensaje) mensaje.textContent = `¡Te equivocaste! Llegaste al nivel ${nivel}.`;
                secuencia = [];
                secuenciaObjetivo = [];

                const selectDif = document.getElementById('selector-dificultad');
                const selectModo = document.getElementById('selector-modo');
                if (selectDif && modo !== 'extremo' && modo !== 'hacker') selectDif.disabled = false;
                if (selectModo) selectModo.disabled = false;

                const btn = document.getElementById('btn-jugar');
                if (btn) {
                    btn.textContent = "Volver a jugar";
                    btn.disabled = false;
                }
            }
        }

        function toggleGrabar() {
            const btnGrabar = document.getElementById('btn-grabar');
            const mensaje = document.getElementById('mensaje');
            if (!esGrabando) {
                esGrabando = true;
                notasGrabadas = [];
                tiempoInicioGrabacion = Date.now();
                if (btnGrabar) {
                    btnGrabar.textContent = "⏹️ Detener";
                    btnGrabar.classList.add('grabando');
                }
                if (mensaje) mensaje.textContent = "🔴 Grabando melodía...";
            } else {
                esGrabando = false;
                if (btnGrabar) {
                    btnGrabar.textContent = "🔴 Grabar";
                    btnGrabar.classList.remove('grabando');
                }
                if (mensaje) mensaje.textContent = `✅ ¡Grabación guardada (${notasGrabadas.length} notas)!`;
            }
        }

        function reproducirGrabacion() {
            if (notasGrabadas.length === 0 || esReproduciendo) return;
            esReproduciendo = true;
            const mensaje = document.getElementById('mensaje');
            if (mensaje) mensaje.textContent = "▶️ Reproduciendo melodía...";

            timeoutsGrabacion.forEach(t => clearTimeout(t));
            timeoutsGrabacion = [];

            notasGrabadas.forEach((nota) => {
                const t = setTimeout(() => {
                    activarBloque(nota.id);
                }, nota.tiempo);
                timeoutsGrabacion.push(t);
            });

            const tiempoTotal = notasGrabadas[notasGrabadas.length - 1].tiempo + 500;
            const tFin = setTimeout(() => {
                esReproduciendo = false;
                if (mensaje) mensaje.textContent = "🎹 Modo Libre (5x5) — Reproducción finalizada";
            }, tiempoTotal);
            timeoutsGrabacion.push(tFin);
        }

        // Inicialización al cargar la página
        construirTablero();
        iniciarAtmosfera();
        const btnJugarEl = document.getElementById('btn-jugar');
        if (btnJugarEl) {
            btnJugarEl.addEventListener('click', iniciarJuego);
        }
    </script>
