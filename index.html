<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oso Espacial Pro</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
        }
        h1 { margin: 10px 0; font-size: 24px; color: #00ffcc; }
        canvas {
            background: #1a1a2e;
            display: block;
            margin: 0 auto;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
        }
        #info { margin-top: 10px; font-size: 16px; }
    </style>
</head>
<body>

    <h1>🐻 ESPACIO ☄️</h1>
    <canvas id="juego" width="360" height="500"></canvas>
    <div id="info">Usa las flechas ⬅️ ➡️ o toca la pantalla</div>

    <script>
        const canvas = document.getElementById("juego");
        const ctx = canvas.getContext("2d");

        let oso = { x: 160, y: 420, ancho: 40, alto: 40, velocidad: 6 };
        let meteoritos = [];
        let puntuacion = 0;
        let jugando = true;
        let teclas = {};

        window.addEventListener("keydown", (e) => teclas[e.key] = true);
        window.addEventListener("keyup", (e) => teclas[e.key] = false);

        // Controles táctiles pa' celus
        canvas.addEventListener("touchmove", (e) => {
            let rect = canvas.getBoundingClientRect();
            let touchX = e.touches[0].clientX - rect.left;
            oso.x = touchX - oso.ancho / 2;
        });

        function crearMeteorito() {
            let x = Math.random() * (canvas.width - 30);
            meteoritos.push({ x: x, y: -30, tamaño: 30, velocidad: 4 + Math.random() * 3 });
        }

        function actualizar() {
            if (!jugando) return;

            // Movimiento del oso
            if ((teclas["ArrowLeft"] || teclas["a"]) && oso.x > 0) {
                oso.x -= oso.velocidad;
            }
            if ((teclas["ArrowRight"] || teclas["d"]) && oso.x < canvas.width - oso.ancho) {
                oso.x += oso.velocidad;
            }

            // Generar meteoritos
            if (Math.random() < 0.04) {
                crearMeteorito();
            }

            // Mover meteoritos y colisiones
            for (let i = meteoritos.length - 1; i >= 0; i--) {
                let m = meteoritos[i];
                m.y += m.velocidad;

                // Colisión con el oso
                if (
                    oso.x < m.x + m.tamaño &&
                    oso.x + oso.ancho > m.x &&
                    oso.y < m.y + m.tamaño &&
                    oso.y + oso.alto > m.y
                ) {
                    jugando = false;
                }

                // Borrar si sale de la pantalla
                if (m.y > canvas.height) {
                    meteoritos.splice(i, 1);
                    puntuacion += 10;
                }
            }
        }

        function dibujar() {
            // Fondo
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dibujar Oso (como un cuadrado pro con carita)
            ctx.fillStyle = "#ffcc00";
            ctx.fillRect(oso.x, oso.y, oso.ancho, oso.alto);
            ctx.fillStyle = "#000";
            ctx.fillRect(oso.x + 8, oso.y + 10, 6, 6);
            ctx.fillRect(oso.x + 26, oso.y + 10, 6, 6);

            // Dibujar Meteoritos
            ctx.fillStyle = "#ff4444";
            for (let m of meteoritos) {
                ctx.beginPath();
                ctx.arc(m.x + m.tamaño / 2, m.y + m.tamaño / 2, m.tamaño / 2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Puntuación
            ctx.fillStyle = "#fff";
            ctx.font = "16px Courier New";
            ctx.fillText("Score: " + puntuacion, 15, 25);

            if (!jugando) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff4444";
                ctx.font = "28px Courier New";
                ctx.fillText("¡GAME OVER!", 80, 230);
                ctx.fillStyle = "#fff";
                ctx.font = "14px Courier New";
                ctx.fillText("Toca pa' reiniciar", 110, 270);
            }
        }

        function loop() {
            actualizar();
            dibujar();
            requestAnimationFrame(loop);
        }

        canvas.addEventListener("click", () => {
            if (!jugando) {
                meteoritos = [];
                puntuacion = 0;
                oso.x = 160;
                jugando = true;
            }
        });

        loop();
    </script>
</body>
</html>
