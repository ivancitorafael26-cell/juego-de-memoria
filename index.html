<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memoria de Bloques Pro</title>
<style>
  :root {
    --bg-main: #0f1115;
    --panel-bg: rgba(22, 27, 34, 0.75);
    --border-color: rgba(255, 255, 255, 0.1);
    --text-main: #f0f3f6;
    --text-muted: #8b949e;
    --accent: #3b82f6;
  }

  body.modo-claro {
    --bg-main: #f0f3f6;
    --panel-bg: rgba(255, 255, 255, 0.85);
    --border-color: rgba(0, 0, 0, 0.1);
    --text-main: #0f1115;
    --text-muted: #57606a;
  }

  body {
    background: var(--bg-main);
    color: var(--text-main);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    user-select: none;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .top-bar {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
    pointer-events: none;
  }
  .top-bar > * { pointer-events: auto; }

  .record-badge {
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }

  .grupo-botones-top { display: flex; gap: 8px; }

  .btn-vista {
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--border-color);
    border-radius: 20px;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    color: var(--text-main);
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    transition: 0.2s;
  }
  .btn-vista:hover { background: rgba(128,128,128,0.15); }

  h1 { margin: 10px 0 5px; font-size: 28px; font-weight: 800; text-align: center; letter-spacing: -0.5px; }
  #estado { font-size: 15px; margin-bottom: 5px; color: var(--text-muted); height: 24px; text-align: center; font-weight: 500; }
  
  #vidasContainer {
    font-size: 18px;
    height: 28px;
    text-align: center;
    margin-bottom: 10px;
    display: none;
    letter-spacing: 4px;
  }

  .controles {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 18px;
    max-width: 680px;
  }

  select {
    padding: 9px 12px;
    font-size: 13px;
    font-weight: 500;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    color: var(--text-main);
    cursor: pointer;
    outline: none;
    transition: 0.2s;
  }
  select:hover { border-color: rgba(128,128,128,0.3); }

  .tablero-container {
    position: relative;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    padding: 20px;
    border-radius: 24px;
    border: 1px solid var(--border-color);
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    transition: 0.3s;
    overflow: hidden;
    min-width: 320px;
    min-height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tablero-container.panico {
    animation: latidoPanico 0.4s infinite alternate;
    border-color: #ef4444 !important;
  }
  @keyframes latidoPanico {
    from { box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
    to { box-shadow: 0 0 25px rgba(239, 68, 68, 0.9); }
  }

  .barra-tiempo {
    position: absolute;
    top: 0; left: 0; height: 4px; background: var(--accent);
    border-radius: 24px 24px 0 0; width: 100%;
    transition: width 0.05s linear, background-color 0.2s;
    display: none;
    z-index: 10;
  }

  .tablero { 
    display: grid; 
    grid-template-columns: repeat(3, 105px); 
    grid-gap: 12px; 
  }

  .bloque {
    border-radius: 14px;
    cursor: pointer;
    opacity: 0.4;
    width: 105px;
    height: 105px;
    transition: transform 0.1s ease, opacity 0.15s ease, box-shadow 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .bloque:hover { opacity: 0.6; }
  .iluminado {
    opacity: 1 !important;
    transform: scale(1.04);
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.9);
  }

  .acciones {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    justify-content: center;
    width: 100%;
    max-width: 380px;
  }
