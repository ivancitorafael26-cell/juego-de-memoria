<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infla el Globo Pro</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 { color: #ff0077; font-size: 24px; margin-bottom: 5px; }
        #puntuacion { font-size: 18px; color: #00ffcc; margin-bottom: 20px; }
        
        #zona-juego {
            width: 300px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #globo {
            width: 50px;
            height: 65px;
            background-color: #ff3366;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            position: relative;
            transition: transform 0.05s ease;
            box-shadow: inset -8px -8px 0px rgba(0,0,0,0.15);
        }

        /* Hilito del globo */
        #globo::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 22px;
            width: 2px;
            height: 15px;
            background-color: #888;
        }

        #btn-inflar {
            background-color: #00ffcc;
            color: #111;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            transition: transform 0.1s;
        }
        #btn-inflar:active { transform: scale(0.95); }

        #mensaje {
            margin-top: 15px;
            font-size: 14px;
            color: #ffcc00;
            height: 20px;
        }
    </style>
</head>
<body>

    <h1>🎈 INFLA EL GLOBO 💥</h1>
    <div id="puntuacion">Puntos: 0 | Récord: 0</div>

    <div id="zona-juego">
        <div id="globo"></div>
    </div>

    <button id="btn-inflar">¡MANTÉN PARA INFLAR!</button>
    <div id="mensaje">Mantén presionado y suelta antes de que explote</div>

    <script>
        const globo = document.getElementById("globo");
        const btn = document.getElementById("btn-inflar");
        const txtPuntuacion = document.getElementById("puntuacion");
        const mensaje = document.getElementById("mensaje");

        let escala = 1;
        let puntos = 0;
        let record = 0;
        let inflando = false;
        let explotado = false;
        let limiteExplosion = 2.4 + Math.random() * 0.6; // Límite aleatorio pa' que sea divertido

        function empezarInflar(e) {
            e.preventDefault();
            if (explotado) return;
            inflando = true;
            mensaje.innerText = "¡Inflando... suelta a tiempo!";
        }

        function detenerInflar(e) {
            e.preventDefault();
            if (!inflando || explotado) return;
            inflando = false;

            if (escala >= limiteExplosion) {
                // ¡Pum! Exploto por pasarse
                explotado = true;
                globo.style.backgroundColor = "#444";
                globo.style.transform = "scale(0)";
                mensaje.innerText = "💥 ¡BOOM! Te pasaste de rosca.";
                puntos = 0;
                setTimeout(reiniciar, 1500);
            } else {
                // ¡Bien hecho! Suma puntos según qué tan grande lo dejó
                let ganado = Math.floor(escala * 10);
                puntos += ganado;
                if (puntos > record) record = puntos;
                mensaje.innerText = `🎉 ¡Perfecto! +${ganado} pts`;
                actualizarScore();
                setTimeout(reiniciar, 1200);
            }
        }

        function reiniciar() {
            explotado = false;
            escala = 1;
            limiteExplosion = 2.0 + Math.random() * 1.0; // Nuevo límite aleatorio
            globo.style.backgroundColor = "#ff3366";
            globo.style.transform = `scale(${escala})`;
            mensaje.innerText = "Mantén presionado y suelta antes de que explote";
        }

        function actualizarScore() {
            txtPuntuacion.innerText = `Puntos: ${puntos} | Récord: ${record}`;
        }

        // Eventos tanto para PC (mouse) como para Celular (touch)
        btn.addEventListener("mousedown", empezarInflar);
        btn.addEventListener("mouseup", detenerInflar);
        
        btn.addEventListener("touchstart", empezarInflar);
        btn.addEventListener("touchend", detenerInflar);

        // Bucle de crecimiento mientras se mantenga presionado
        setInterval(() => {
            if (inflando && !explotado) {
                escala += 0.025;
                globo.style.transform = `scale(${escala})`;

                // Si se pasa del límite explota al instante
                if (escala >= limiteExplosion) {
                    inflando = false;
                    explotado = true;
                    globo.style.backgroundColor = "#444";
                    globo.style.transform = "scale(0)";
                    mensaje.innerText = "💥 ¡BOOM! Explotó muy rápido.";
                    puntos = 0;
                    setTimeout(reiniciar, 1500);
                }
            }
        }, 30);
    </script>
</body>
</html>
